services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smart_bi_test
      MYSQL_USER: smart_bi_test
      MYSQL_PASSWORD: test_only_password
      MYSQL_ROOT_PASSWORD: test_only_root_password
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://smart_bi_test:test_only_password@mysql:3306/smart_bi_test
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FRONTEND_ORIGIN: http://localhost:8080
      QUERY_TIMEOUT_SECONDS: 5
      AI_DEFAULT_TIMEOUT_SECONDS: 30
    depends_on:
      mysql:
        condition: service_healthy

  mock-llm:
    build:
      context: ./backend
    volumes:
      - ./backend/mock_llm:/app/mock_llm:ro
    command: uvicorn mock_llm.main:app --host 0.0.0.0 --port 8090

volumes:
  mysql_test_data:
