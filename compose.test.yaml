services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smart_bi_test
      MYSQL_USER: smart_bi_test
      MYSQL_PASSWORD: test_only_password
      MYSQL_ROOT_PASSWORD: test_only_root_password
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://smart_bi_test:test_only_password@mysql:3306/smart_bi_test
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FRONTEND_ORIGIN: http://127.0.0.1:8081
      QUERY_TIMEOUT_SECONDS: 5
      AI_DEFAULT_TIMEOUT_SECONDS: 30
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mock-llm:
    build:
      context: ./backend
    volumes:
      - ./backend/mock_llm:/app/mock_llm:ro
    command: uvicorn mock_llm.main:app --host 0.0.0.0 --port 8090

volumes:
  mysql_test_data:
